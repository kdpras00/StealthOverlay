<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="WhisperCue - Invisible AI Desktop Overlay Assistant">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="WhisperCue">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>WhisperCue — Invisible AI Desktop Overlay Assistant</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts for Web fallback & CSS matching -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'Graphik';
      src: url('assets/fonts/Graphik-Regular.otf') format('opentype'),
           local('Graphik'), local('Graphik-Regular'), local('Graphik Regular');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Graphik';
      src: url('assets/fonts/Graphik-Medium.otf') format('opentype'),
           local('Graphik-Medium'), local('Graphik Medium');
      font-weight: 500;
    }
    @font-face {
      font-family: 'Graphik';
      src: url('assets/fonts/Graphik-Bold.otf') format('opentype'),
           local('Graphik-Bold'), local('Graphik Bold');
      font-weight: 700;
    }
    @font-face {
      font-family: 'Deacon';
      src: url('assets/fonts/Deacon-Regular.otf') format('opentype'),
           local('Deacon'), local('Deacon-Regular'), local('Deacon Regular');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Deacon';
      src: url('assets/fonts/Deacon-Bold.otf') format('opentype'),
           local('Deacon-Bold'), local('Deacon Bold');
      font-weight: 700;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: #06090E;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    html, body, flt-glass-pane, flt-scene-host, flt-renderer {
      font-family: 'Graphik', 'Deacon', sans-serif !important;
    }

    /* Prevent HTML video platform view from trapping mouse wheel scroll events */
    flt-platform-view {
      pointer-events: none !important;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
