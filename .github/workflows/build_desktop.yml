name: Release Windows and Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/WhisperCue.app WhisperCue-macOS.zip
      - run: bash scripts/build_macos_dmg.sh build/macos/Build/Products/Release/WhisperCue.app WhisperCue-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: WhisperCue-macOS.zip
          path: WhisperCue-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WhisperCue-macOS.dmg
          path: WhisperCue-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath WhisperCue-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WhisperCue-Windows.zip
          path: WhisperCue-Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libkeybinder-3.0-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - run: |
          cp packaging/linux/whispercue.desktop build/linux/x64/release/bundle/WhisperCue.desktop
          cp packaging/linux/icons/hicolor/512x512/apps/whispercue.png build/linux/x64/release/bundle/whispercue.png
      - run: tar -C build/linux/x64/release/bundle -czf WhisperCue-Linux.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: WhisperCue-Linux.tar.gz
          path: WhisperCue-Linux.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: cd release && sha256sum WhisperCue-macOS.zip WhisperCue-macOS.dmg WhisperCue-Windows.zip WhisperCue-Linux.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/WhisperCue-macOS.zip
            release/WhisperCue-macOS.dmg
            release/WhisperCue-Windows.zip
            release/WhisperCue-Linux.tar.gz
            release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
