name: Build WhisperCue Multi-Platform Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: macOS
            os: macos-latest
            cmd: flutter build macos --release
            output: build/macos/Build/Products/Release/whisper_cue.app
            artifact_name: whisper_cue-macOS
          - target: Windows
            os: windows-latest
            cmd: flutter build windows --release
            output: build/windows/x64/runner/Release
            artifact_name: whisper_cue-Windows
          - target: Linux
            os: ubuntu-latest
            cmd: flutter build linux --release
            output: build/linux/x64/release/bundle
            artifact_name: whisper_cue-Linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: matrix.target == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Desktop App
        run: ${{ matrix.cmd }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output }}
