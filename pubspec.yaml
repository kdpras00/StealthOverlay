name: whisper_cue
description: "WhisperCue - High-Performance AI Desktop Overlay Assistant."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  window_manager: ^0.4.3
  flutter_acrylic: ^1.1.4
  hotkey_manager: ^0.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.2
  shared_preferences: ^2.3.5
  web_socket_channel: ^3.0.0
  http: ^1.2.0
  file_picker: ^8.1.2
  syncfusion_flutter_pdf: ^26.2.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Graphik
      fonts:
        - asset: assets/fonts/Graphik-Regular.otf
          weight: 400
        - asset: assets/fonts/Graphik-Medium.otf
          weight: 500
        - asset: assets/fonts/Graphik-Bold.otf
          weight: 700
    - family: Deacon
      fonts:
        - asset: assets/fonts/Deacon-Regular.otf
          weight: 400
        - asset: assets/fonts/Deacon-Bold.otf
          weight: 700
        - asset: assets/fonts/Deacon-Black.otf
          weight: 900

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
