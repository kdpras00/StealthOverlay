<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Stealth Overlay Bridge</title>
  <style>
    body {
      width: 240px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      margin: 0;
      background: #ffffff;
      color: #111827;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e5e7eb;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #10b981; /* Active Green */
    }
    h3 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      color: #111827;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .toggle-text {
      font-size: 12px;
      font-weight: 600;
      color: #374151;
    }
    .status-label {
      font-size: 12px;
      font-weight: 700;
      color: #6b7280;
      margin-right: 8px;
    }
    .status-label.on {
      color: #10b981;
    }

    /* Switch */
    .switch-container {
      display: flex;
      align-items: center;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #d1d5db;
      transition: .2s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    input:checked + .slider {
      background-color: #10b981;
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-group">
      <div id="statusDot" class="status-dot"></div>
      <h3>Stealth Overlay Bridge</h3>
    </div>
  </div>

  <div class="toggle-row">
    <span class="toggle-text">Overlay AI</span>
    <div class="switch-container">
      <span id="statusLabel" class="status-label">OFF</span>
      <label class="switch">
        <input type="checkbox" id="toggleOverlay">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
